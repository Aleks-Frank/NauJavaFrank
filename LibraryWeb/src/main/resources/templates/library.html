<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h1>Library</h1>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Name Book</th>
        <th>Author</th>
        <th>Publication</th>
        <th>Year</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="book : ${listBooks}">
        <th th:text="${book.idBook}"></th>
        <th th:text="${book.name}"></th>
        <th th:text="${book.author}"></th>
        <th th:text="${book.namePublication}"></th>
        <th th:text="${book.bookYear}"></th>
    </tr>
    </tbody>
</table>
<a href="/book/create">Create Book</a>
</body>
</html>
